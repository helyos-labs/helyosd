[package]
name = "helyosd"
description = "Helyos daemon — container orchestration engine"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/helyos-labs/helyosd"
rust-version = "1.88"

[lib]
name = "helyosd"
path = "src/lib.rs"

[[bin]]
name = "helyosd"
path = "src/main.rs"

[dependencies]
helyos-core = { git = "https://github.com/helyos-labs/helyos-core", tag = "v0.1.7" }
# default-features=false drops the `protobuf` exposition format (and its
# vulnerable protobuf 2.x dep, RUSTSEC-2024-0437); we only use TextEncoder.
prometheus = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
bollard = "0.18"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tonic = { version = "0.12", features = ["tls"] }
rcgen = "0.13"
prost = "0.13"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
sysinfo = "0.32"
tokio-stream = { version = "0.1", features = ["io-util"] }
async-stream = "0.3"
hostname = "0.4"
parking_lot = "0.12"
tokio-util = "0.7"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
rustls = { version = "0.23", features = ["ring"] }

[[bench]]
name = "sqlite_store"
harness = false

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "dns"
harness = false
