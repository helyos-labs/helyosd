name: Proto

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - "buf.yaml"
      - ".github/workflows/proto.yml"
  pull_request:
    branches: [main]
    paths:
      - "proto/**"
      - "buf.yaml"
      - ".github/workflows/proto.yml"

jobs:
  buf:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
