name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Ignored advisories (no clean fix available; not in our attack surface):
      #   RUSTSEC-2023-0071 — rsa (Marvin timing): pulled only via sqlx-mysql,
      #     which sqlx-macros links unconditionally; we use the sqlite driver
      #     only, so the RSA code path is never executed. No fixed release.
      #   RUSTSEC-2025-0134 — rustls-pemfile unmaintained, transitive via tonic.
      # Fixed (not ignored): protobuf RUSTSEC-2024-0437 (prometheus
      # default-features=false), time RUSTSEC-2026-0009 (>= 0.3.47), and
      # serde_yml/libyml RUSTSEC-2025-0067/0068 (serde_yml -> serde_yaml_ng).
      - run: >
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0134

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test api_integration
      - run: cargo test --test sqlite_integration
      - run: docker pull busybox:latest
      - run: cargo test --test runtime_integration -- --ignored

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [check, test]
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker pull busybox:latest
      - run: cargo test --test e2e -- --ignored --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Library tests only — integration/e2e tests need a Docker daemon.
      - run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
