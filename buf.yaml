version: v2
modules:
  - path: proto
lint:
  use:
    - BASIC
  except:
    # The proto lives at proto/cluster.proto (a flat layout) rather than
    # proto/nexa/cluster/v1/cluster.proto, so the package-to-directory rule
    # does not apply here.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
